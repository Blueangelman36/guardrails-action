; The README names the asof and chesterton releases action.yml pins. Dependabot
; moves the pins; this keeps the README saying which releases they are.

[asof]
include = README.md

[asof-version]
type = version
run = python -c "import re; print(re.search(r'asof@[0-9a-f]{40} # v([0-9.]+)', open('action.yml').read()).group(1))"
why = The asof release action.yml runs.

[chesterton-version]
type = version
run = python -c "import re; print(re.search(r'chesterton@[0-9a-f]{40} # v([0-9.]+)', open('action.yml').read()).group(1))"
why = The chesterton (fence) release action.yml runs.
